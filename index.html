<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class ="container-sm p-5 my-5 rounded border border-black bg-secondary">
        <h1 class="display-3 pb-4 text-bg-secondary"><small>Kay's </small>Bootstrap Page</h1>
        <p class="text-bg-dark p-2 display-6">Welcome! Here's an introduction to my <kbd>characters</kbd>.</p>

        <div class="row">
        <div class="col p-2 bg-dark">
            <img src="https://creativeimpetus.neocities.org/img/jargoon_stairs.jpg" class="mx-auto d-block img-fluid" alt="...">
        </div>
        <div class="col p-2 bg-dark">
            <img src="https://creativeimpetus.neocities.org/img/evergreen_chair.jpg" class="mx-auto d-block img-fluid" alt="...">
        </div>
    </div>
        <div class="container mt-2 p-4">
        <div class="alert alert-secondary alert-dismissible fade show" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            Drawings by Kay, in MS Paint.
        </div>
    </div>
    <div class="container">
        <table class="table table-dark table-striped table-hover">
            <thead>
                <tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                    <th>Suffix</th>
                    <th>Title</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Jargoon</td>
                    <td>Jarcounce</td>
                    <td>IV</td>
                    <td>Viscountess</td>
                </tr>
                <tr>
                    <td>Evergreen</td>
                    <td>Alabons&#233</td>
                    <td>IX</td>
                    <td>Lady</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
